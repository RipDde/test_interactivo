<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />
  <title>Test Interactivo Autocorregible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="./img/imagen_test.png" type="image/png">

  <!-- React y ReactDOM desde CDN (versión fija para que no cambie sola) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel para permitir JSX en navegadores -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <link rel="stylesheet" href="style.css" />

  <script src="js/1. preguntasSASP.js"></script> <!-- 1 -->
  <script src="js/2. preguntasASO.js"></script> <!-- 2 -->
  <script src="js/3. preguntasMPO.js"></script> <!-- 3 -->
  <script src="js/4. preguntasIPE.js"></script> <!-- 4 -->
  <script src="js/5. preguntasSAD.js"></script> <!-- 5 -->
  <script src="js/6. preguntasDASP.js"></script> <!-- 6 -->
  <script src="js/7. preguntasSRI.js"></script> <!-- 7 -->
  <script src="js/8. preguntasASGD.js"></script> <!-- 8 -->
  <script src="js/9. preguntasINGLÉS.js"></script> <!-- 9 -->
  <script src="js/10. preguntasIAW.js"></script> <!-- 10 -->

</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    // Para añadir una asignatura: cargar su .js arriba y añadir una línea aquí.
    // El orden de este objeto es el orden de las pestañas.
    const ASIGNATURAS = {
      SASP: preguntasSASP,
      ASO: preguntasASO,
      MPO: preguntasMPO,
      IPE: preguntasIPE,
      SAD: preguntasSAD,
      DASP: preguntasDASP,
      SRI: preguntasSRI,
      ASGD: preguntasASGD,
      "INGLÉS": preguntasINGLÉS,
      IAW: preguntasIAW
    };

    const PREGUNTAS_POR_TEST = 30;

    // Mezcla de Fisher-Yates: todas las ordenaciones son igual de probables
    // (sort con Math.random() - 0.5 no lo garantiza).
    function mezclarArray(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function irAPregunta(i) {
      const elemento = document.getElementById(`pregunta-${i}`);
      if (elemento) {
        elemento.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    function TestInteractivo() {
      const [asignatura, setAsignatura] = React.useState("SAD");
      const [ronda, setRonda] = React.useState(0);

      const preguntasActuales = ASIGNATURAS[asignatura];

      const [preguntasMezcladas, setPreguntasMezcladas] = React.useState([]);
      const [respuestas, setRespuestas] = React.useState([]);
      const [marcadas, setMarcadas] = React.useState([]);
      const [corregido, setCorregido] = React.useState(false);
      const [mostrarResultado, setMostrarResultado] = React.useState(false);

      // Se genera un test nuevo al cambiar de asignatura o al pulsar «Nuevo test».
      React.useEffect(() => {
        const nuevas = mezclarArray(preguntasActuales).slice(0, PREGUNTAS_POR_TEST);
        setPreguntasMezcladas(nuevas);
        setRespuestas(Array(nuevas.length).fill(null));
        setMarcadas(Array(nuevas.length).fill(false));
        setCorregido(false);
        setMostrarResultado(false);
      }, [asignatura, ronda]);

      // La tecla Esc cierra el resultado.
      React.useEffect(() => {
        if (!mostrarResultado) return;
        const alPulsar = (e) => {
          if (e.key === "Escape") setMostrarResultado(false);
        };
        window.addEventListener("keydown", alPulsar);
        return () => window.removeEventListener("keydown", alPulsar);
      }, [mostrarResultado]);

      const totalPreguntas = preguntasMezcladas.length;
      const valorPregunta = totalPreguntas > 0 ? 10 / totalPreguntas : 0;

      const seleccionar = (pIndex, rIndex) => {
        if (corregido) return;
        // Se parte de «previas» (el estado más reciente), no de «respuestas»,
        // para no perder clics rápidos seguidos.
        setRespuestas(previas => {
          const copia = [...previas];
          copia[pIndex] = rIndex;
          return copia;
        });
      };

      const toggleMarcada = (i) => {
        setMarcadas(previas => {
          const copia = [...previas];
          copia[i] = !copia[i];
          return copia;
        });
      };

      const aciertos = respuestas.reduce((acc, r, i) => {
        if (r === preguntasMezcladas[i]?.correcta) return acc + 1;
        return acc;
      }, 0);

      const fallos = respuestas.reduce((acc, r, i) => {
        if (r !== null && r !== preguntasMezcladas[i]?.correcta) return acc + 1;
        return acc;
      }, 0);

      const noRespondidas = respuestas.filter(r => r === null).length;
      const respondidas = totalPreguntas - noRespondidas;

      // Cada 3 fallos restan una pregunta acertada.
      const penalizacion = Math.floor(fallos / 3) * valorPregunta;
      const puntaje = Math.max(0, aciertos * valorPregunta - penalizacion);

      const finalizar = () => {
        if (noRespondidas > 0 &&
            !window.confirm(`Quedan ${noRespondidas} preguntas sin responder. ¿Finalizar de todos modos?`)) {
          return;
        }
        setCorregido(true);
        setMostrarResultado(true);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const nuevoTest = () => {
        setRonda(r => r + 1);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <>
          <header className="topbar">
            <div className="topbar-content">
              <h1 className="logo">Test interactivo</h1>
              <p className="subtitulo">Autocorregible · {PREGUNTAS_POR_TEST} preguntas al azar por test</p>

              <nav className="nav-asignaturas" aria-label="Asignaturas">
                {Object.keys(ASIGNATURAS).map((nombre) => (
                  <button
                    key={nombre}
                    type="button"
                    className={`nav-btn ${asignatura === nombre ? "nav-btn-active" : ""}`}
                    aria-current={asignatura === nombre ? "page" : undefined}
                    onClick={() => setAsignatura(nombre)}
                  >
                    {nombre}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main className="contenido-principal">
            <div className="test-container">
              {totalPreguntas === 0 && (
                <p className="sin-preguntas">Esta asignatura todavía no tiene preguntas.</p>
              )}

              {preguntasMezcladas.map((p, i) => (
                <section key={i} id={`pregunta-${i}`} className="card">
                  <div className="question-header">
                    <h2 className="question-title">
                      <span className="question-num">Pregunta {i + 1} de {totalPreguntas}</span>
                      {p.enunciado}
                    </h2>

                    <button
                      type="button"
                      className={`btn-marcar ${marcadas[i] ? "btn-marcar-activa" : ""}`}
                      onClick={() => toggleMarcada(i)}
                      title={marcadas[i] ? "Desmarcar pregunta" : "Marcar para revisar"}
                      aria-label={marcadas[i] ? "Desmarcar pregunta" : "Marcar para revisar"}
                      aria-pressed={marcadas[i]}
                    >
                      ⚑
                    </button>
                  </div>

                  <div className="opciones">
                    {p.opciones.map((op, j) => {
                      const seleccionado = respuestas[i] === j;
                      const esCorrecta = p.correcta === j;

                      let clases = "answer-btn";
                      let estado = null;
                      if (seleccionado) clases += " answer-selected";
                      if (corregido && seleccionado && !esCorrecta) {
                        clases += " answer-wrong";
                        estado = "Tu respuesta";
                      }
                      if (corregido && esCorrecta) {
                        clases += " answer-correct";
                        estado = "Correcta";
                      }

                      return (
                        <button
                          key={j}
                          type="button"
                          onClick={() => seleccionar(i, j)}
                          className={clases}
                          disabled={corregido}
                          aria-pressed={seleccionado}
                        >
                          <span className="opcion-letra">{String.fromCharCode(65 + j)}</span>
                          <span className="opcion-texto">{op}</span>
                          {estado && <span className="opcion-estado">{estado}</span>}
                        </button>
                      );
                    })}
                  </div>

                  {corregido && p.explicacion && (
                    <div className="explicacion">
                      <strong>Explicación</strong>
                      <p>{p.explicacion}</p>
                    </div>
                  )}
                </section>
              ))}

              {totalPreguntas > 0 && (
                <div className="final-lista">
                  <button
                    type="button"
                    className="btn-primario"
                    onClick={corregido ? nuevoTest : finalizar}
                  >
                    {corregido ? "Nuevo test" : "Finalizar test"}
                  </button>
                </div>
              )}
            </div>

            <aside className="columna-mapa">
              <div className="panel">
                <div className="panel-cabecera">
                  <h3>Progreso</h3>
                  <span className="contador">{respondidas} / {totalPreguntas}</span>
                </div>

                <div className="barra-progreso">
                  <div style={{ width: `${totalPreguntas ? (respondidas / totalPreguntas) * 100 : 0}%` }} />
                </div>

                <div className="grid-mapa">
                  {preguntasMezcladas.map((_, i) => {
                    let claseMapa = "item-mapa";

                    if (corregido) {
                      if (respuestas[i] === null) {
                        claseMapa += " en-blanco";
                      } else if (respuestas[i] === preguntasMezcladas[i].correcta) {
                        claseMapa += " acertada";
                      } else {
                        claseMapa += " erronea";
                      }
                    } else if (respuestas[i] !== null) {
                      claseMapa += " respondida";
                    }

                    if (marcadas[i]) {
                      claseMapa += " marcada";
                    }

                    return (
                      <button
                        key={i}
                        type="button"
                        className={claseMapa}
                        onClick={() => irAPregunta(i)}
                        aria-label={`Ir a la pregunta ${i + 1}`}
                      >
                        {i + 1}
                      </button>
                    );
                  })}
                </div>

                <ul className="leyenda">
                  {corregido ? (
                    <>
                      <li><i className="l-acertada" />Acierto</li>
                      <li><i className="l-erronea" />Fallo</li>
                      <li><i className="l-en-blanco" />En blanco</li>
                    </>
                  ) : (
                    <>
                      <li><i className="l-respondida" />Respondida</li>
                      <li><i className="l-marcada" />Marcada</li>
                    </>
                  )}
                </ul>

                {corregido && (
                  <div className="nota-panel">
                    <span>Nota</span>
                    <strong>{puntaje.toFixed(2)}</strong>
                  </div>
                )}

                {totalPreguntas > 0 && (
                  <button
                    type="button"
                    className="btn-primario"
                    onClick={corregido ? nuevoTest : finalizar}
                  >
                    {corregido ? "Nuevo test" : "Finalizar"}
                  </button>
                )}

                {corregido && (
                  <button
                    type="button"
                    className="btn-secundario"
                    onClick={() => setMostrarResultado(true)}
                  >
                    Ver resultado
                  </button>
                )}

                <p className="disponibles">{preguntasActuales.length} preguntas en el banco de {asignatura}</p>
              </div>
            </aside>
          </main>

          {mostrarResultado && (
            <div
              className="modal-overlay"
              onClick={() => setMostrarResultado(false)}
            >
              <div
                className="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="titulo-resultado"
                onClick={(e) => e.stopPropagation()}
              >
                <h2 id="titulo-resultado">Resultado · {asignatura}</h2>
                <p className="modal-nota">{puntaje.toFixed(2)} <span>/ 10</span></p>

                <dl className="modal-datos">
                  <div className="d-acertadas"><dt>Acertadas</dt><dd>{aciertos}</dd></div>
                  <div className="d-erroneas"><dt>Erróneas</dt><dd>{fallos}</dd></div>
                  <div><dt>En blanco</dt><dd>{noRespondidas}</dd></div>
                </dl>

                {penalizacion > 0 && (
                  <p className="modal-nota-penalizacion">
                    Penalización: −{penalizacion.toFixed(2)} (cada 3 fallos restan un acierto)
                  </p>
                )}

                <button
                  type="button"
                  className="btn-primario"
                  onClick={() => setMostrarResultado(false)}
                  autoFocus
                >
                  Revisar respuestas
                </button>
                <button
                  type="button"
                  className="btn-secundario"
                  onClick={nuevoTest}
                >
                  Nuevo test
                </button>
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TestInteractivo />);
  </script>

  <footer>
    <p>Creado por E.R.</p>
  </footer>
</body>

</html>
